name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0

jobs:
  quality-and-package:
    name: Quality and VSIX package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Record tool and runner versions
        run: |
          node --version
          npm --version
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"

      - name: Install from lockfile
        run: npm ci

      - name: Verify production dependency licenses and notice freshness
        run: node scripts/security-check.mjs --check-notices

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Rust formatting, lint, tests, and notices
        run: |
          npm run rust:format
          npm run rust:lint
          npm run rust:test
          npm run rust:notices:check

      - name: Run unit and fixture tests
        run: npm test

      - name: Run acceptance component gate
        run: npm run test:acceptance

      - name: Run security boundary gate
        run: npm run test:security

      - name: Review runtime dependencies and licenses
        run: npm run dependency:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundles
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Verify reproducible VSIX bytes
        run: node scripts/check-vsix-reproducibility.mjs artifacts/okf-workbench.vsix

      - name: Inspect VSIX contents
        run: npm run package:check

      - name: Retain package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-workbench-vsix-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/build-metadata.json
            artifacts/okf-workbench.vsix
            artifacts/runtime-licenses.json
          if-no-files-found: error
          retention-days: 14

  webview-browser:
    name: Webview browser and hostile-content gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install from lockfile
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Webview behavior gate
        run: npm run test:webview

      - name: Run hostile-content and no-egress gate
        run: npm run test:security:webview

  extension-integration:
    name: Extension integration (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum-1.121.0
            vscode-version: 1.121.0
          - label: current-1.129.1
            vscode-version: 1.129.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Record editor and runner versions
        run: |
          echo "vscode_version=${VSCODE_TEST_VERSION}"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Run extension integration tests
        run: xvfb-run --auto-servernum npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
