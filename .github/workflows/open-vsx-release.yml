name: Open VSX release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: open-vsx-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0
  EXTENSION_ID: straydog.okf-workbench
  VSIX_NAME: okf-workbench.vsix

jobs:
  build-candidate:
    name: Validate tag and package VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Validate release identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

          VERSION="$(node --input-type=module -e "
            import manifest from './package.json' with { type: 'json' };
            if (manifest.publisher !== 'straydog' || manifest.name !== 'okf-workbench') {
              throw new Error('Unexpected extension identity.');
            }
            process.stdout.write(manifest.version);
          ")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}; expected ${EXPECTED_TAG}."
            exit 1
          fi

          if grep -Fq "## ${VERSION} - Unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain the publication date before tagging ${EXPECTED_TAG}."
            exit 1
          fi

          {
            echo "artifact_name=open-vsx-candidate-${VERSION}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            echo "revision=${GITHUB_SHA}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install from lockfile
        run: npm ci

      - name: Verify production dependency licenses and notice freshness
        run: node scripts/security-check.mjs --check-notices

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Rust formatting, lint, tests, and notices
        run: |
          npm run rust:format
          npm run rust:lint
          npm run rust:test
          npm run rust:notices:check

      - name: Run unit and fixture tests
        run: npm test

      - name: Run acceptance component gate
        run: npm run test:acceptance

      - name: Run security boundary gate
        run: npm run test:security

      - name: Review runtime dependencies and licenses
        run: npm run dependency:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        run: npm run package

      - name: Verify reproducible VSIX bytes
        run: node scripts/check-vsix-reproducibility.mjs artifacts/${VSIX_NAME}

      - name: Inspect VSIX contents
        run: npm run package:check

      - name: Inspect packaged security and license boundary
        run: node scripts/security-check.mjs --vsix artifacts/${VSIX_NAME}

      - name: Record package checksum
        shell: bash
        run: |
          cd artifacts
          sha256sum "${VSIX_NAME}" > "${VSIX_NAME}.sha256"

      - name: Retain release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            artifacts/build-metadata.json
            artifacts/okf-workbench.vsix
            artifacts/okf-workbench.vsix.sha256
            artifacts/runtime-licenses.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-cli:
    name: Build native CLI (${{ matrix.label }})
    needs: build-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            binary: okf
          - os: ubuntu-24.04
            label: linux-x86_64
            binary: okf
          - os: windows-2025
            label: windows-x86_64
            binary: okf.exe
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build-candidate.outputs.revision }}

      - name: Resolve pinned Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Test and build the native CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace
          cargo build --locked --release --bin okf

      - name: Package the native CLI with notices
        shell: bash
        env:
          CLI_BINARY: ${{ matrix.binary }}
          CLI_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          package="okf-cli-${CLI_LABEL}"
          mkdir -p "artifacts/${package}"
          cp "target/release/${CLI_BINARY}" "artifacts/${package}/${CLI_BINARY}"
          cp LICENSE "artifacts/${package}/LICENSE.txt"
          cp RUST_THIRD_PARTY_NOTICES.md "artifacts/${package}/RUST_THIRD_PARTY_NOTICES.md"
          tar -C artifacts -czf "artifacts/${package}.tar.gz" "${package}"
          cd artifacts
          shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"

      - name: Retain the native CLI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-cli-${{ matrix.label }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/okf-cli-${{ matrix.label }}.tar.gz
            artifacts/okf-cli-${{ matrix.label }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  github-release:
    name: Create GitHub release
    needs:
      - build-candidate
      - build-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: release-candidate

      - name: Download the retained native CLIs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-cli-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate
          merge-multiple: true

      - name: Verify every retained checksum
        working-directory: release-candidate
        shell: bash
        run: |
          set -euo pipefail
          for checksum in *.sha256; do
            sha256sum --check "${checksum}"
          done

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload \
              "${RELEASE_TAG}" \
              release-candidate/*.tar.gz \
              release-candidate/*.sha256 \
              "release-candidate/${VSIX_NAME}" \
              --clobber
          else
            gh release create \
              "${RELEASE_TAG}" \
              release-candidate/*.tar.gz \
              release-candidate/*.sha256 \
              "release-candidate/${VSIX_NAME}" \
              --generate-notes \
              --title "OKF Workbench ${RELEASE_VERSION}" \
              --verify-tag
          fi

  publish-openvsx:
    name: Publish retained VSIX to Open VSX
    needs:
      - build-candidate
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build-candidate.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the locked Open VSX CLI
        run: |
          npm install --global npm@${NPM_VERSION}
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/ovsx --version)" = "1.0.2"

      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: release-candidate

      - name: Verify retained package checksum
        working-directory: release-candidate
        run: sha256sum --check "${VSIX_NAME}.sha256"

      - name: Verify straydog namespace authorization
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "::error::OPEN_VSX_TOKEN is not configured."
            exit 1
          fi
          ./node_modules/.bin/ovsx verify-pat straydog

      - name: Publish the retained VSIX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: ./node_modules/.bin/ovsx publish "release-candidate/${VSIX_NAME}" --skip-duplicate
