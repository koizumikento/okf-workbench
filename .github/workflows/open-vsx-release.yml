name: Open VSX release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: open-vsx-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0
  EXTENSION_ID: straydog.okf-workbench
  VSIX_NAME: okf-workbench.vsix

jobs:
  build-candidate:
    name: Validate tag and package VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Validate release identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi

          VERSION="$(node --input-type=module -e "
            import manifest from './package.json' with { type: 'json' };
            if (manifest.publisher !== 'straydog' || manifest.name !== 'okf-workbench') {
              throw new Error('Unexpected extension identity.');
            }
            process.stdout.write(manifest.version);
          ")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}; expected ${EXPECTED_TAG}."
            exit 1
          fi

          if grep -Fq "## ${VERSION} - Unreleased" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain the publication date before tagging ${EXPECTED_TAG}."
            exit 1
          fi

          {
            echo "artifact_name=open-vsx-candidate-${VERSION}-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
            echo "revision=${GITHUB_SHA}"
            echo "version=${VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install from lockfile
        run: npm ci

      - name: Verify production dependency licenses and notice freshness
        run: node scripts/security-check.mjs --check-notices

      - name: Check formatting
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check Rust formatting, lint, tests, and notices
        run: |
          npm run rust:format
          npm run rust:lint
          npm run rust:test
          npm run rust:notices:check

      - name: Run unit and fixture tests
        run: npm test

      - name: Run acceptance component gate
        run: npm run test:acceptance

      - name: Run security boundary gate
        run: npm run test:security

      - name: Review runtime dependencies and licenses
        run: npm run dependency:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package VSIX
        run: npm run package

      - name: Verify reproducible VSIX bytes
        run: node scripts/check-vsix-reproducibility.mjs artifacts/${VSIX_NAME}

      - name: Inspect VSIX contents
        run: npm run package:check

      - name: Inspect packaged security and license boundary
        run: node scripts/security-check.mjs --vsix artifacts/${VSIX_NAME}

      - name: Record package checksum
        shell: bash
        run: |
          cp dist/okf_core.wasm artifacts/okf_core.wasm
          cd artifacts
          sha256sum "${VSIX_NAME}" > "${VSIX_NAME}.sha256"

      - name: Retain release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            artifacts/build-metadata.json
            artifacts/okf-workbench.vsix
            artifacts/okf-workbench.vsix.sha256
            artifacts/runtime-licenses.json
            artifacts/okf_core.wasm
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  build-cli:
    name: Build native CLI (${{ matrix.label }})
    needs: build-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macos-aarch64
            target: darwin-arm64
            binary: okf
          - os: macos-15-intel
            label: macos-x86_64
            target: darwin-x64
            binary: okf
          - os: ubuntu-24.04
            label: linux-x86_64
            target: linux-x64
            binary: okf
          - os: windows-2025
            label: windows-x86_64
            target: win32-x64
            binary: okf.exe
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build-candidate.outputs.revision }}

      - name: Resolve pinned Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install from lockfile
        shell: bash
        run: |
          npm install --global npm@${NPM_VERSION}
          npm ci

      - name: Download the canonical Wasm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: artifacts/canonical-wasm

      - name: Test and build the native CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace
          cargo build --locked --release --bin okf

      - name: Package the same native CLI for standalone and extension distribution
        shell: bash
        env:
          CLI_BINARY: ${{ matrix.binary }}
          CLI_LABEL: ${{ matrix.label }}
          PACKAGE_TARGET: ${{ matrix.target }}
          OKF_ALLOW_CANONICAL_WASM: '1'
          OKF_CANONICAL_WASM_PATH: ${{ github.workspace }}/artifacts/canonical-wasm/okf_core.wasm
        run: |
          set -euo pipefail
          cli="target/release/${CLI_BINARY}"
          vsix="artifacts/okf-workbench-${PACKAGE_TARGET}.vsix"
          package="okf-cli-${CLI_LABEL}"
          mkdir -p "artifacts/${package}"
          cp "${cli}" "artifacts/${package}/${CLI_BINARY}"
          cp LICENSE "artifacts/${package}/LICENSE.txt"
          cp RUST_THIRD_PARTY_NOTICES.md "artifacts/${package}/RUST_THIRD_PARTY_NOTICES.md"
          cmp "${cli}" "artifacts/${package}/${CLI_BINARY}"
          tar -C artifacts -czf "artifacts/${package}.tar.gz" "${package}"
          npm run build
          node scripts/package-vsix.mjs \
            "${vsix}" --target "${PACKAGE_TARGET}" --cli "${cli}"
          node scripts/check-vsix-reproducibility.mjs \
            "${vsix}" --target "${PACKAGE_TARGET}" --cli "${cli}"
          node scripts/package-check.mjs "${vsix}"
          node scripts/check-cli-parity.mjs "${cli}" "${vsix}"
          node scripts/security-check.mjs --vsix "${vsix}"
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"
            sha256sum "okf-workbench-${PACKAGE_TARGET}.vsix" \
              > "okf-workbench-${PACKAGE_TARGET}.vsix.sha256"
          else
            shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256"
            shasum -a 256 "okf-workbench-${PACKAGE_TARGET}.vsix" \
              > "okf-workbench-${PACKAGE_TARGET}.vsix.sha256"
          fi

      - name: Retain standalone CLI and matching platform VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-platform-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/okf-cli-${{ matrix.label }}.tar.gz
            artifacts/okf-cli-${{ matrix.label }}.tar.gz.sha256
            artifacts/okf-workbench-${{ matrix.target }}.vsix
            artifacts/okf-workbench-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  github-release:
    name: Create GitHub release
    needs:
      - build-candidate
      - build-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: release-candidate

      - name: Download the retained platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-platform-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate
          merge-multiple: true

      - name: Verify every retained checksum
        working-directory: release-candidate
        shell: bash
        run: |
          set -euo pipefail
          for checksum in *.sha256; do
            sha256sum --check "${checksum}"
          done

      - name: Create or update the GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-candidate.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload \
              "${RELEASE_TAG}" \
              release-candidate/*.tar.gz \
              release-candidate/*.sha256 \
              release-candidate/*.vsix \
              --clobber
          else
            gh release create \
              "${RELEASE_TAG}" \
              release-candidate/*.tar.gz \
              release-candidate/*.sha256 \
              release-candidate/*.vsix \
              --generate-notes \
              --title "OKF Workbench ${RELEASE_VERSION}" \
              --verify-tag
          fi

  publish-package-repo:
    name: Publish Homebrew formula and Scoop manifest
    needs:
      - build-candidate
      - build-cli
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build-candidate.outputs.revision }}

      - name: Download the retained platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-platform-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-packages
          merge-multiple: true

      - name: Verify CLI archives and generate package manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          archives=(
            okf-cli-macos-aarch64.tar.gz
            okf-cli-macos-x86_64.tar.gz
            okf-cli-windows-x86_64.tar.gz
          )
          for archive in "${archives[@]}"; do
            checksum="release-packages/${archive}.sha256"
            [[ -f "release-packages/${archive}" ]]
            [[ -f "${checksum}" ]]
            (
              cd release-packages
              sha256sum --check "${archive}.sha256"
            )
          done

          macos_arm64_sha="$(awk 'NR == 1 { print $1 }' \
            release-packages/okf-cli-macos-aarch64.tar.gz.sha256)"
          macos_x64_sha="$(awk 'NR == 1 { print $1 }' \
            release-packages/okf-cli-macos-x86_64.tar.gz.sha256)"
          windows_x64_sha="$(awk 'NR == 1 { print $1 }' \
            release-packages/okf-cli-windows-x86_64.tar.gz.sha256)"

          node scripts/generate-package-manifests.mjs \
            --tag "${RELEASE_TAG}" \
            --repo "${SOURCE_REPO}" \
            --macos-arm64-sha "${macos_arm64_sha}" \
            --macos-x64-sha "${macos_x64_sha}" \
            --windows-x64-sha "${windows_x64_sha}" \
            --output-dir package-manifests
          node scripts/generate-package-manifests.mjs \
            --tag "${RELEASE_TAG}" \
            --repo "${SOURCE_REPO}" \
            --macos-arm64-sha "${macos_arm64_sha}" \
            --macos-x64-sha "${macos_x64_sha}" \
            --windows-x64-sha "${windows_x64_sha}" \
            --output-dir package-manifests-second

          cmp package-manifests/okf.rb package-manifests-second/okf.rb
          cmp package-manifests/okf.json package-manifests-second/okf.json
          ruby -c package-manifests/okf.rb
          jq -e \
            --arg version "${RELEASE_TAG#v}" \
            --arg sha "${windows_x64_sha}" \
            '.version == $version and
             .architecture["64bit"].hash == $sha and
             .architecture["64bit"].extract_dir == "okf-cli-windows-x86_64" and
             .bin == "okf.exe"' \
            package-manifests/okf.json >/dev/null

      - name: Push manifests to stray-tools
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STRAY_TOOLS_TOKEN: ${{ secrets.STRAY_TOOLS_TOKEN }}
          TAP_REPO: ${{ secrets.TAP_REPO }}
        run: |
          set -euo pipefail

          if [[ -z "${STRAY_TOOLS_TOKEN:-}" ]]; then
            echo "::error::STRAY_TOOLS_TOKEN is not configured."
            exit 1
          fi
          if [[ -z "${TAP_REPO:-}" ]]; then
            echo "::error::TAP_REPO is not configured."
            exit 1
          fi
          if ! [[ "${TAP_REPO}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]] ||
             [[ "${TAP_REPO}" == *..* ]] ||
             [[ "${TAP_REPO}" == *. ]]; then
            echo "::error::TAP_REPO must be a safe owner/repository identifier."
            exit 1
          fi

          export GH_TOKEN="${STRAY_TOOLS_TOKEN}"
          gh auth setup-git
          gh repo clone "${TAP_REPO}" package-repository
          mkdir -p package-repository/Formula package-repository/bucket
          cp package-manifests/okf.rb package-repository/Formula/okf.rb
          cp package-manifests/okf.json package-repository/bucket/okf.json

          cd package-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/okf.rb bucket/okf.json

          if git diff --cached --quiet; then
            echo "Package manifests are already up to date."
            exit 0
          fi

          changed_paths="$(git diff --cached --name-only)"
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              Formula/okf.rb|bucket/okf.json) ;;
              *)
                echo "::error::Refusing to publish unexpected path."
                exit 1
                ;;
            esac
          done <<< "${changed_paths}"

          git commit -m "okf ${RELEASE_TAG}"
          git push origin HEAD

  publish-openvsx:
    name: Publish retained VSIX to Open VSX
    needs:
      - build-candidate
      - build-cli
      - github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build-candidate.outputs.revision }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install the locked Open VSX CLI
        run: |
          npm install --global npm@${NPM_VERSION}
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/ovsx --version)" = "1.0.2"

      - name: Download the retained candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: release-candidate

      - name: Download the retained platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-platform-*-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate
          merge-multiple: true

      - name: Verify retained package checksums
        working-directory: release-candidate
        shell: bash
        run: |
          set -euo pipefail
          for checksum in *.sha256; do
            sha256sum --check "${checksum}"
          done

      - name: Verify straydog namespace authorization
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo "::error::OPEN_VSX_TOKEN is not configured."
            exit 1
          fi
          ./node_modules/.bin/ovsx verify-pat straydog

      - name: Publish universal fallback and every platform VSIX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/ovsx publish "release-candidate/${VSIX_NAME}" --skip-duplicate
          for vsix in release-candidate/okf-workbench-*.vsix; do
            ./node_modules/.bin/ovsx publish "${vsix}" --skip-duplicate
          done
