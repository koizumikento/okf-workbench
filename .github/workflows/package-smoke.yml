name: Package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0

jobs:
  security-boundaries:
    name: Browser security boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust and Wasm toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install from lockfile
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Build the current Webview
        run: npm run build

      - name: Retain the canonical Wasm for cross-platform packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-workbench-canonical-wasm-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/okf_core.wasm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Run the real-browser security boundary
        run: npm run test:security:webview

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: security-boundaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            binary: okf
          - os: macos-15-intel
            target: darwin-x64
            binary: okf
          - os: ubuntu-24.04
            target: linux-x64
            binary: okf
          - os: windows-2025
            target: win32-x64
            binary: okf.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pinned Rust and Wasm toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        shell: bash
        run: npm install --global npm@${NPM_VERSION}

      - name: Record runner versions
        shell: bash
        run: |
          node --version
          npm --version
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"

      - name: Download the canonical Wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: okf-workbench-canonical-wasm-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/canonical-wasm

      - name: Build, test, and inspect package
        shell: bash
        env:
          OKF_ALLOW_CANONICAL_WASM: '1'
          OKF_CANONICAL_WASM_PATH: ${{ github.workspace }}/artifacts/canonical-wasm/okf_core.wasm
          PACKAGE_TARGET: ${{ matrix.target }}
          CLI_BINARY: ${{ matrix.binary }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run rust:format
          npm run rust:lint
          npm run rust:test
          npm run rust:notices:check
          npm run test:platform-package
          npm run test:security
          npm run dependency:check
          cargo build --locked --release --bin okf
          npm run build
          vsix="artifacts/okf-workbench-${PACKAGE_TARGET}.vsix"
          cli="target/release/${CLI_BINARY}"
          node scripts/package-vsix.mjs "${vsix}" --target "${PACKAGE_TARGET}" --cli "${cli}"
          node scripts/check-vsix-reproducibility.mjs \
            "${vsix}" --target "${PACKAGE_TARGET}" --cli "${cli}"
          node scripts/package-check.mjs "${vsix}"
          node scripts/check-cli-parity.mjs "${cli}" "${vsix}"

      - name: Retain package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-workbench-package-smoke-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/build-metadata.json
            artifacts/okf-workbench-${{ matrix.target }}.vsix
            artifacts/runtime-licenses.json
          if-no-files-found: error
          retention-days: 14

  cross-platform-reproducibility:
    name: Platform VSIX set consistency
    needs: package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-workbench-package-smoke-*
          path: package-evidence

      - name: Require every platform package and one canonical Wasm core
        run: node scripts/check-platform-vsix-set.mjs package-evidence
