name: Package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0

jobs:
  security-boundaries:
    name: Browser security boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install from lockfile
        run: npm ci

      - name: Install pinned Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Build the current Webview
        run: npm run build

      - name: Run the real-browser security boundary
        run: npm run test:security:webview

  package-smoke:
    name: Package smoke (${{ matrix.os }})
    needs: security-boundaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Pin npm
        shell: bash
        run: npm install --global npm@${NPM_VERSION}

      - name: Record runner versions
        shell: bash
        run: |
          node --version
          npm --version
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "image_os=${ImageOS}"
          echo "image_version=${ImageVersion}"

      - name: Build, test, and inspect package
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run test:acceptance
          npm run test:security
          npm run dependency:check
          npm run package
          node scripts/check-vsix-reproducibility.mjs artifacts/okf-workbench.vsix
          npm run package:check

      - name: Retain package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okf-workbench-package-smoke-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/build-metadata.json
            artifacts/okf-workbench.vsix
            artifacts/runtime-licenses.json
          if-no-files-found: error
          retention-days: 14

  cross-platform-reproducibility:
    name: Cross-platform VSIX byte identity
    needs: package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download package evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: okf-workbench-package-smoke-*
          path: package-evidence

      - name: Require identical package bytes from every runner
        run: node scripts/check-cross-platform-vsix.mjs package-evidence
