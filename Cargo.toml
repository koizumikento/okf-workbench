[workspace]
members = ["crates/okf-core", "crates/okf-wasm", "crates/okf-cli"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/koizumikento/okf-workbench"
rust-version = "1.92"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap = { version = "4.5.53", features = ["derive"] }
getrandom = "0.4.3"
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "raw_value"] }
serde_yaml = "0.9.34"
thiserror = "2.0.17"
tempfile = "3.23.0"
walkdir = "2.5.0"
rustix = { version = "1.1.4", features = ["fs"] }
libc = "0.2.189"
windows-sys = { version = "0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
